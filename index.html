<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wordCloud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Inter:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Interactive word study</p>
        <h1>wordCloud</h1>
        <p class="subtitle">
          Type a word, press enter or click add, and watch the cloud respond to
          frequency.
        </p>
      </header>

      <section class="controls" aria-label="Word input">
        <form id="word-form" autocomplete="off">
          <label class="sr-only" for="word-input">Add a word</label>
          <input
            id="word-input"
            name="word"
            type="text"
            placeholder="Enter a word"
            maxlength="40"
          />
          <button type="submit">Add</button>
          <button id="clear-button" class="secondary-button" type="button">
            Clear
          </button>
        </form>
        <p class="hint">
          Common filler words are muted in gray. Repeated, meaningful words grow
          darker and bolder.
        </p>
      </section>

      <section class="cloud-panel">
        <div id="word-cloud" class="word-cloud" aria-live="polite"></div>
      </section>
    </main>

    <script src="script.js?v=clear-button-1"></script>
  </body>
</html>
